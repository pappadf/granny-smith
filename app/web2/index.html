<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#090b11" />
    <title>Granny Smith</title>
    <!-- Pre-paint: the skin on <html> before any stylesheet applies, so a
         persisted skin never flashes the default (Midnight) first.
         state/appearance.svelte.ts corrects it against the registry when
         the app starts. -->
    <script>
      (function () {
        var d = document.documentElement;
        var ls = null;
        try {
          ls = window.localStorage;
        } catch (e) {}
        var q = new URLSearchParams(location.search);
        d.dataset.skin = q.get('skin') || (ls && ls.getItem('gs-skin')) || 'midnight';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>

    <!-- Cross-origin isolation service worker. Required on static hosts
         like GitHub Pages that can't set COOP/COEP headers themselves.
         Locally, scripts/dev_server.py and Vite's dev server send the
         real headers, so the SW is unnecessary on localhost. -->
    <script>
      if ('serviceWorker' in navigator) {
        const isLocalhost = ['localhost', '127.0.0.1', ''].includes(location.hostname);
        if (isLocalhost) {
          // A dev server (scripts/dev_server.py, Vite) sends the COOP/COEP
          // headers itself.  A worker registered by an earlier build would
          // still be controlling this origin and re-wrapping every
          // response -- which is how a 2 MB main.wasm streamed through it
          // ends in ERR_CONTENT_LENGTH_MISMATCH on reload.  Unregister
          // anything stale; the change takes effect on the next load.
          // (Only here: on a static host the worker IS what isolates the
          // page, and crossOriginIsolated is true BECAUSE it is running.)
          navigator.serviceWorker.getRegistrations().then((regs) => {
            for (const reg of regs) reg.unregister();
          });
        } else if (!crossOriginIsolated) {
          // COEP credentialless where the browser has it (Chromium exposes
          // window.credentialless), require-corp elsewhere: Safari ignores
          // credentialless, and the page would never be isolated.  The
          // choice is part of the worker's URL, so a page that registered
          // the other one (or the older, credentialless-only worker)
          // updates it and reloads once the new one is active.
          const coep = 'credentialless' in window ? 'credentialless' : 'require-corp';
          navigator.serviceWorker.register('./coi-serviceworker.js?coep=' + coep).then(
            (reg) => {
              const awaitActivated = (worker) => {
                worker.addEventListener('statechange', () => {
                  if (worker.state === 'activated') location.reload();
                });
              };
              if (reg.installing) awaitActivated(reg.installing);
              else if (reg.waiting) awaitActivated(reg.waiting);
              else if (reg.active && !navigator.serviceWorker.controller) location.reload();
            },
            (err) => console.warn('COI service worker registration failed:', err),
          );
        }
      }
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
