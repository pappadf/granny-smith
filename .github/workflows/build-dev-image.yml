name: Build & Publish Dev Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      # Rebuild only when the actual Docker build context or workflow changes.
      # devcontainer/devcontainer.json edits (extensions, ports, postCreateCommand, etc.)
      # should NOT force an image rebuild; they are applied at container creation time.
      - ".devcontainer/Dockerfile"
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/build-dev-image.yml"

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/pappadf/granny-smith-dev"
          TAG_BASE="ubuntu24-emsdk4.0.10-node22"
          echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_BASE}" >> $GITHUB_OUTPUT

      - name: Set up QEMU (optional multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          # NOTE: add more platforms if you want multi-arch (e.g., linux/arm64)
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Dev image with Emscripten 4.0.10, Node 22, C/C++ toolchain
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:cache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:cache,mode=max

      - name: Resolve digest for immutable pin
        id: digest
        run: |
          DIGEST=$(skopeo inspect --no-tags docker://${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} | jq -r '.Digest')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
        env:
          # skopeo is preinstalled on GitHub-hosted runners; if not, apt-get install skopeo -y
          # jq is also available; otherwise apt-get install -y jq
          # Nothing else required
          XDG_RUNTIME_DIR: /tmp

      - name: Save digest artifact
        run: |
          echo "${{ steps.meta.outputs.image }}@${{ steps.digest.outputs.digest }}" > image_digest.txt
        shell: bash

      # GHCR never garbage-collects. Re-pushing a moving tag orphans the old
      # version rather than removing it, and `cache-to: mode=max` exports every
      # intermediate layer on every build, so versions accumulate indefinitely
      # (that cache is the bulk of them, and is untagged).
      #
      # Only untagged versions are removed: the image is single-platform
      # (linux/amd64), so there are no multi-arch child manifests that pruning
      # could orphan — which is the usual way this action bites people. The
      # buildx cache goes with them, so the next build is cold; `cache-to`
      # rewrites it every run, so that costs time and nothing else.
      #
      # continue-on-error because this is housekeeping: a retention hiccup must
      # not fail a build that has already pushed a good image. It shows up as a
      # yellow step, so a persistent failure is still visible.
      - name: Prune untagged dev images
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: granny-smith-dev
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 10
