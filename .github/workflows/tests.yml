name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# Every `run:` uses bash, not the container's default sh. Steps here pipe into
# tee and then `exit "${PIPESTATUS[0]}"` to surface the real command's status
# rather than tee's — PIPESTATUS is a bashism, and under dash it expands to
# nothing and the step dies with "Bad substitution" AFTER the tests have
# already passed. GitHub's bash mode also sets -o pipefail, so the pipeline
# status is correct twice over.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pappadf/granny-smith-dev:ubuntu24-emsdk4.0.10-node22
      # Optionally, after a build you can pin by digest instead for immutability:
      # image: ghcr.io/pappadf/granny-smith-dev@sha256:<digest-here>
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # NOTE: GS_TEST_DATA_TOKEN is scoped to the single step that needs it
    # (see "Fetch test data" below) to minimize exposure to other steps/actions.
    # Secrets are not available to fork PRs, so external PRs see an empty value.

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # 7z extracts the large binary archives (CD-ROM images and the like).
      # The devcontainer Dockerfile installs `7zip`, so this VERIFIES rather
      # than installs — see the m68k step below for why self-repair is the
      # wrong shape here.
      - name: Verify 7z presence
        shell: bash
        run: |
          which 7z || {
            echo '7z not on PATH — the pinned dev image is wrong or stale'
            exit 1
          }
          7z i | sed -n '1,2p'

      # m68k binutils assembles the generic declaration-ROM fragments
      # (tools/vrom / src/core/peripherals/nubus/vrom68k).  The devcontainer
      # Dockerfile installs it, so this VERIFIES rather than installs: a
      # self-repairing step hides a stale image pin, which is exactly how
      # publish-staging drifted onto a five-month-old image unnoticed.
      - name: Verify m68k binutils presence
        shell: bash
        run: |
          which m68k-linux-gnu-as || {
            echo 'm68k-linux-gnu-as not on PATH — the pinned dev image is wrong or stale'
            exit 1
          }
          m68k-linux-gnu-as --version | sed -n '1p'

      # Fetch proprietary test data (only works for internal builds with token access)
      - name: Fetch test data
        id: fetch-data
        run: |
          if [ -n "$GS_TEST_DATA_TOKEN" ]; then
            # No flag: fetches the revision pinned in tests/data-version, not
            # whatever gs-test-data HEAD happens to be. CI is therefore
            # reproducible against the media the goldens were captured from,
            # and adopting newer data is a reviewed pin bump rather than
            # something that silently changes under a green build.
            ./scripts/fetch-test-data.sh
            # Only mark test data as available once fetch actually succeeds,
            # otherwise gated steps below would run without data and fail confusingly.
            echo "has_test_data=true" >> $GITHUB_OUTPUT
          else
            echo "has_test_data=false" >> $GITHUB_OUTPUT
            echo "::notice::Test data not available (external contributor or missing secret)"
            echo "Skipping integration and e2e tests that require proprietary data."
          fi
        env:
          GS_TEST_DATA_TOKEN: ${{ secrets.GS_TEST_DATA_TOKEN }}

      - name: Verify emcc presence
        shell: bash
        run: |
          which emcc || { echo 'emcc not on PATH'; exit 1; }
          emcc -v | head -n 5

      - name: Show tool versions
        run: |
          node -v
          npm -v
          emcc -v | head -n 5
          g++ --version | head -n 1
          cmake --version | head -n 1
          ninja --version

      - name: Install dependencies (root)
        run: |
          if [ -f package-lock.json ]; then npm ci; fi

      - name: Build (clean)
        shell: bash
        run: |
          rm -rf build
          make

      - name: List build artifacts
        run: ls -l build || true

      # CPU unit tests can run without proprietary test data
      # (they use third-party/single-step-tests)
      - name: Run unit tests (CPU)
        run: |
          make -C tests/unit run

      # Integration and e2e tests require proprietary test data.
      #
      # §5.4 tiers: unit is seconds, matrix is the per-machine boot suites,
      # extended is the long diagnostics, installers and app choreography.
      # Normally the PR gate is unit + matrix and extended is nightly-only —
      # but while the integration-test rework settles, extended runs here too
      # (see its step below). Suites are parallel-safe because each test gets a
      # private GS_STORAGE_CACHE, so nothing writes beside the shared media.
      - name: Run integration tests (unit tier)
        if: steps.fetch-data.outputs.has_test_data == 'true'
        run: |
          make integration-test TIER=unit -j"$(nproc)" 2>&1 | tee /tmp/it-unit.log
          exit "${PIPESTATUS[0]}"

      - name: Run integration tests (matrix tier)
        if: steps.fetch-data.outputs.has_test_data == 'true'
        run: |
          make integration-test TIER=matrix -j"$(nproc)" 2>&1 | tee /tmp/it-matrix.log
          exit "${PIPESTATUS[0]}"

      # Extended tier on the PR gate as well as the nightly, TEMPORARILY.
      # §5.4 puts the long diagnostics, installers and app choreography in the
      # nightly so the PR gate stays quick; while the integration-test rework
      # settles we want the full set on every PR and every push to main
      # instead, so a regression in a long row is caught before merge rather
      # than the following morning. KEEP_GOING=1 so one red row does not
      # truncate the report (§5.7) — the build still fails at the end.
      #
      # Revert to nightly-only once the rework has proven stable: delete this
      # step, and the nightly workflow already covers the tier unchanged.
      - name: Run integration tests (extended tier)
        if: steps.fetch-data.outputs.has_test_data == 'true'
        timeout-minutes: 120
        run: |
          make integration-test TIER=extended TEST_VARS="KEEP_GOING=1" \
            2>&1 | tee /tmp/it-extended.log
          exit "${PIPESTATUS[0]}"

      # Coverage contract (§5.6): diff the cells the run actually reported
      # (@@COV records, read from the live machine) against the declared
      # roster in tests/integration/matrix-targets.json. A declared cell that
      # went uncovered fails; cells owed by another tier, blocked by a known
      # emulator defect, or gated on absent media are reported, not failed.
      - name: Check coverage contract
        if: steps.fetch-data.outputs.has_test_data == 'true'
        run: |
          python3 scripts/test-matrix.py --check --tier=matrix /tmp/it-matrix.log \
            | tee /tmp/coverage.log
          exit "${PIPESTATUS[0]}"

      # Golden-collision gate: two DIFFERENT goldens asserted in one script must
      # not hold identical bytes, or one frame is silently doing the work of
      # several assertions. Needs no test data and no build — it only reads the
      # scripts and the committed PNGs — so it runs regardless of the data fetch
      # and catches a bad recapture before the expensive tiers do.
      - name: Check golden distinctness
        run: python3 scripts/check-goldens.py

      # Performance gate (§5.8, dimension 1): per-row guest instruction spend
      # is host-independent and bit-reproducible, so a row outside its
      # tolerance band is a real change and fails like a pixel golden.
      # Absorbing a legitimate timing change means committing a reviewed
      # perf-baselines.json diff (scripts/gen-baselines.py) in the same PR.
      - name: Check performance baselines
        if: steps.fetch-data.outputs.has_test_data == 'true'
        run: |
          python3 scripts/test-matrix.py --perf /tmp/it-matrix.log | tee /tmp/perf.log
          exit "${PIPESTATUS[0]}"

      - name: Coverage + row report into the step summary
        if: always() && steps.fetch-data.outputs.has_test_data == 'true'
        run: |
          {
            echo "## Integration coverage"
            echo '```'
            cat /tmp/coverage.log 2>/dev/null || echo "(no coverage log)"
            echo '```'
            echo "### Cells covered by this run"
            python3 scripts/test-matrix.py --from-results /tmp/it-matrix.log 2>/dev/null || true
            echo "### Milestone rows (known gaps, non-fatal)"
            grep -h "MILESTONE" /tmp/it-matrix.log /tmp/it-extended.log 2>/dev/null || echo "(none)"
            echo "### Extended-tier coverage (temporarily on the PR gate)"
            echo '```'
            python3 scripts/test-matrix.py --check --tier=extended /tmp/it-extended.log 2>&1 || true
            echo '```'
            echo "### Per-row instruction spend vs baselines"
            echo '```'
            cat /tmp/perf.log 2>/dev/null || echo "(no perf log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: the browser end-to-end suite (Playwright) now runs in the `ui`
      # job against the web2 (Svelte) frontend — see `make ui2-e2e` there.
      # The legacy web UI's e2e (tests/e2e/specs/**) was retired with it.

      - name: Summary for builds without test data
        if: steps.fetch-data.outputs.has_test_data == 'false'
        run: |
          echo "## ⚠️ Limited Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This build ran with **limited test coverage** because proprietary test data is not available." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tests that ran:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit tests (CPU instruction tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tests that were skipped:**" >> $GITHUB_STEP_SUMMARY
          echo "- ⏭️ Integration tests (require ROM and disk images)" >> $GITHUB_STEP_SUMMARY
          echo "- ⏭️ E2E Playwright tests (require ROM and disk images; run in the ui job)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For full test coverage, see [docs/TEST_DATA.md](../docs/TEST_DATA.md)." >> $GITHUB_STEP_SUMMARY

  # New Svelte UI at app/web2. Typecheck + lint + Vitest + Vite build, then
  # the WASM build and the browser end-to-end suites: prod-smoke (always) and
  # the functional web2 Playwright specs (gated on proprietary test data).
  # This is the sole home of browser e2e since the legacy web UI was retired.
  ui:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pappadf/granny-smith-dev:ubuntu24-emsdk4.0.10-node22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # `submodules: recursive` pulls the remaining submodules (e.g.
      # single-step-tests). Peeler is now in-tree under src/peeler, so the
      # WASM build no longer depends on a submodule checkout.
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # 7z extracts the large binary archives (e.g. the A/UX HD) the functional
      # web2 e2e specs boot from (see the matching step in the test job).
      - name: Verify 7z presence
        shell: bash
        run: |
          which 7z || {
            echo '7z not on PATH — the pinned dev image is wrong or stale'
            exit 1
          }
          7z i | sed -n '1,2p'

      # m68k binutils for the WASM build's declaration-ROM fragments —
      # verified, not installed (see the matching step in the test job).
      - name: Verify m68k binutils presence
        shell: bash
        run: |
          which m68k-linux-gnu-as || {
            echo 'm68k-linux-gnu-as not on PATH — the pinned dev image is wrong or stale'
            exit 1
          }
          m68k-linux-gnu-as --version | sed -n '1p'

      # Fetch proprietary test data (internal builds with token access only).
      # Gates the functional web2 e2e below; the token is scoped to this step.
      - name: Fetch test data
        id: fetch-data
        run: |
          if [ -n "$GS_TEST_DATA_TOKEN" ]; then
            ./scripts/fetch-test-data.sh
            echo "has_test_data=true" >> $GITHUB_OUTPUT
          else
            echo "has_test_data=false" >> $GITHUB_OUTPUT
            echo "::notice::Test data not available — running prod-smoke only, skipping functional web2 e2e."
          fi
        env:
          GS_TEST_DATA_TOKEN: ${{ secrets.GS_TEST_DATA_TOKEN }}

      - name: Show tool versions
        run: |
          node -v
          npm -v

      - name: Install (app/web2)
        working-directory: app/web2
        run: npm ci

      - name: svelte-check
        working-directory: app/web2
        run: npm run check

      - name: Lint + format check
        working-directory: app/web2
        run: npm run lint

      - name: Vitest
        working-directory: app/web2
        run: npm test

      - name: Vite build
        working-directory: app/web2
        run: npm run build

      # Cheap static check — catches origin-rooted URLs and missing
      # COI service worker before they 404 on a real subpath deploy.
      # Doesn't need WASM; runs against bare Vite output.
      - name: check-dist (static validation of app/web2/dist/)
        run: node scripts/check-dist.mjs

      # Full WASM build, then copy artifacts into dist/ so the
      # prod-smoke test below can actually bootstrap the bridge.
      - name: WASM build (for prod-smoke)
        run: make

      - name: ui2 (copy WASM into app/web2/dist/)
        run: make ui2

      - name: Install Playwright (tests/e2e)
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # End-to-end smoke: serves dist/ from a subpath WITHOUT
      # COOP/COEP headers, asserts the page reaches __gsReady and
      # crossOriginIsolated === true. This is the production env
      # GitHub Pages provides; `make run` masks it.
      - name: prod-smoke (Playwright)
        run: make ui2-prod-smoke

      # Functional web2 end-to-end suite (tests/e2e/web2-specs/**): config
      # dialog, checkpoint resume, display drop, URL boot, A/UX realtime boot,
      # video-mode shader baselines, Lisa/Xenix, filesystem tab. Needs the
      # proprietary ROMs/disks, so it's gated on the fetch above. `make
      # ui2-e2e`'s webServer rebuilds + serves app/web2/dist with COOP/COEP.
      - name: web2 e2e (Playwright)
        if: steps.fetch-data.outputs.has_test_data == 'true'
        env:
          CI: true
        run: make ui2-e2e

      - name: Upload UI build (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-web2-dist
          path: app/web2/dist
          if-no-files-found: ignore

      - name: Upload e2e traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web2-e2e-traces
          path: tests/e2e/test-results
          if-no-files-found: ignore
