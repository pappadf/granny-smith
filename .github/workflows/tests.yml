name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# Least privilege: the default GITHUB_TOKEN may write to the repository,
# and nothing here needs to. packages: read pulls the dev container.
permissions:
  contents: read
  packages: read

# One run per branch: a push to a PR supersedes the run still going on its
# previous commit. Every commit on main keeps its own run and verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every `run:` uses bash, not the container's default sh. Steps here pipe into
# tee and then `exit "${PIPESTATUS[0]}"` to surface the real command's status
# rather than tee's — PIPESTATUS is a bashism, and under dash it expands to
# nothing and the step dies with "Bad substitution" AFTER the tests have
# already passed. GitHub's bash mode also sets -o pipefail, so the pipeline
# status is correct twice over.
defaults:
  run:
    shell: bash

jobs:
  # The native headless build and the static checks that need neither data
  # nor a long run.  A fork PR (no data) still gets these and the unit job.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/pappadf/granny-smith-dev:ubuntu24-emsdk6.0.7-node22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 7z extracts the large binary archives (CD-ROM images and the like) and
      # m68k binutils assembles the declaration-ROM fragments.  The dev image
      # installs both, so these VERIFY rather than install: a self-repairing
      # step hides a stale image pin, which is exactly how publish-staging
      # drifted onto a five-month-old image unnoticed.
      - name: Verify 7z and m68k binutils
        run: |
          which 7z || { echo '7z not on PATH — the pinned dev image is wrong or stale'; exit 1; }
          which m68k-linux-gnu-as || { echo 'm68k-linux-gnu-as not on PATH — the pinned dev image is wrong or stale'; exit 1; }

      # PLATEN=1 WERROR=1 as every integration shard builds it, so a
      # warning or a link failure is reported once, here, by name.
      - name: Build headless (clean)
        run: |
          rm -rf build
          make -f Makefile.headless PLATEN=1 WERROR=1 -j"$(nproc)"

      - name: Check core layering
        run: bash tests/integration/core-layering/run.sh

      - name: Check every integration test has a tier
        run: make -C tests/integration check-tiers

      # Two DIFFERENT goldens asserted in one script must not hold identical
      # bytes, or one frame is silently doing the work of several assertions.
      - name: Check golden distinctness
        run: python3 scripts/check-goldens.py

  # The native unit suites and their wasm32 rerun.  They need the CPU corpora
  # (submodules) but no proprietary data, and nothing else needs them, so
  # they run beside the integration shards instead of in front of them.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/pappadf/granny-smith-dev:ubuntu24-emsdk6.0.7-node22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Run unit tests (native)
        run: make -j"$(nproc)" --output-sync=target -C tests/unit run WERROR=1

      # The parser and storage suites again under emcc + node: the shipping
      # build is wasm32, where size_t and long are 32 bits.
      - name: Run unit tests (wasm32)
        run: make -C tests/unit run-wasm32 WERROR=1

  # Every integration tier, as ONE longest-first -j pool, split across
  # runners.  tests/integration/test-weights.json orders the tests (longest
  # first, so the long suites never start late) and bin-packs them onto the
  # shards; every shard computes the same partition from the same file, and
  # `make integration-test SHARD=k/4` reproduces one locally.  Fixture
  # groups (a producer and the tests that restore its checkpoint) pack as
  # one item, so they always share a shard.
  #
  # The extended tier is on the PR gate as well as the nightly while the
  # integration-test rework settles; in this pool it costs CPU-seconds on
  # whichever shard it lands, not a serial half hour after the matrix tier.
  #
  # PLATEN=1 throughout: the printer rows reach the PostScript interpreter
  # only in a bridge build (without it they detect the missing interpreter,
  # log a skip and pass).  KEEP_GOING=1 so one red row does not truncate a
  # suite's report — the shard still fails at the end.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The shard count is the length of this list (strategy.job-total
        # below); the contracts job checks for that many logs.
        shard: [1, 2, 3, 4]
    container:
      image: ghcr.io/pappadf/granny-smith-dev:ubuntu24-emsdk6.0.7-node22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 7z extracts the large binary archives (CD-ROM images and the like) and
      # m68k binutils assembles the declaration-ROM fragments.  The dev image
      # installs both, so these VERIFY rather than install: a self-repairing
      # step hides a stale image pin, which is exactly how publish-staging
      # drifted onto a five-month-old image unnoticed.
      - name: Verify 7z and m68k binutils
        run: |
          which 7z || { echo '7z not on PATH — the pinned dev image is wrong or stale'; exit 1; }
          which m68k-linux-gnu-as || { echo 'm68k-linux-gnu-as not on PATH — the pinned dev image is wrong or stale'; exit 1; }

      # Proprietary test data (internal builds with token access only).  No
      # flag: fetches the revision pinned in tests/data-version, so CI runs
      # against the media the goldens were captured from.  The token is
      # scoped to this step; fork PRs see it empty and skip the data steps.
      - name: Fetch test data
        id: fetch-data
        run: |
          if [ -n "$GS_TEST_DATA_TOKEN" ]; then
            ./scripts/fetch-test-data.sh
            echo "has_test_data=true" >> $GITHUB_OUTPUT
          else
            echo "has_test_data=false" >> $GITHUB_OUTPUT
            echo "::notice::Test data not available (external contributor or missing secret)"
          fi
        env:
          GS_TEST_DATA_TOKEN: ${{ secrets.GS_TEST_DATA_TOKEN }}

      # --output-sync=target prints each test's output as one block when it
      # ends, so parallel tests never interleave inside a line (a split
      # @@COV or @@PERF record, or a PASS line in the middle of another
      # test's output, would mislead the contracts job).  The price is no
      # live output from a test until it finishes.
      - name: Run integration tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        if: steps.fetch-data.outputs.has_test_data == 'true'
        run: |
          mkdir -p shard-out
          make integration-test PLATEN=1 WERROR=1 TIER="unit matrix extended" \
            SHARD=${{ matrix.shard }}/${{ strategy.job-total }} TEST_VARS="KEEP_GOING=1" -j"$(nproc)" \
            --output-sync=target 2>&1 | tee shard-out/it-shard.log
          exit "${PIPESTATUS[0]}"

      # The log carries the @@COV / @@PERF records the contracts job checks;
      # durations.jsonl is what scripts/gen-test-weights.py regenerates the
      # weights from.  Both go into ONE directory and are uploaded from
      # there: upload-artifact keeps paths relative to the files' common
      # ancestor, and two files from different trees land at different depths
      # in the artifact, which the contracts job's glob then misses.
      - name: Collect shard durations
        if: always() && steps.fetch-data.outputs.has_test_data == 'true'
        run: cp tests/integration/test-results/durations.jsonl shard-out/ 2>/dev/null || true

      - name: Upload shard log
        if: always() && steps.fetch-data.outputs.has_test_data == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: integration-shard-${{ matrix.shard }}
          path: shard-out/
          if-no-files-found: error

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-shard-${{ matrix.shard }}
          path: tests/integration/test-results
          if-no-files-found: ignore

  # The coverage and performance contracts over the UNION of the shard logs:
  # a cell is covered if any shard covered it.
  contracts:
    needs: integration
    if: always() && needs.integration.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: integration-shard-*
          path: shards

      # Skipping is right only when there was no test data to run with (a
      # fork PR has no token).  With data, every shard must have uploaded its
      # log: a missing one would otherwise turn the contracts into a green
      # check of nothing.
      - name: Gather shard logs
        id: logs
        env:
          HAS_DATA: ${{ secrets.GS_TEST_DATA_TOKEN != '' }}
        run: |
          n=$(ls shards/*/it-shard.log 2>/dev/null | wc -l)
          if [ "$HAS_DATA" != "true" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No test data (no token): contracts skipped"
            exit 0
          fi
          if [ "$n" -ne 4 ]; then
            echo "::error::expected 4 shard logs (the integration matrix), found $n"
            ls -R shards || true
            exit 1
          fi
          echo "have=true" >> "$GITHUB_OUTPUT"
          cat shards/*/it-shard.log > /tmp/it-all.log
          cat shards/*/durations.jsonl > /tmp/durations.jsonl 2>/dev/null || true

      # A declared cell that went uncovered fails; cells owed by another
      # tier, blocked by a known defect, or gated on absent media are
      # reported, not failed.
      - name: Check coverage contract (matrix tier)
        if: steps.logs.outputs.have == 'true'
        run: |
          python3 scripts/test-matrix.py --check --tier=matrix /tmp/it-all.log | tee /tmp/coverage.log
          exit "${PIPESTATUS[0]}"

      - name: Check coverage contract (extended tier)
        if: steps.logs.outputs.have == 'true'
        run: |
          python3 scripts/test-matrix.py --check --tier=extended /tmp/it-all.log | tee /tmp/coverage-extended.log
          exit "${PIPESTATUS[0]}"

      # Per-row guest instruction spend is host-independent and
      # bit-reproducible, so a row outside its band is a real change.
      - name: Check performance baselines
        if: steps.logs.outputs.have == 'true'
        run: |
          python3 scripts/test-matrix.py --perf /tmp/it-all.log | tee /tmp/perf.log
          exit "${PIPESTATUS[0]}"

      - name: Coverage, rows and timings into the step summary
        if: always() && steps.logs.outputs.have == 'true'
        run: |
          {
            echo "## Integration coverage"
            echo '```'
            cat /tmp/coverage.log 2>/dev/null || echo "(no coverage log)"
            echo '```'
            echo "### Cells covered by this run"
            python3 scripts/test-matrix.py --from-results /tmp/it-all.log 2>/dev/null || true
            echo "### Milestone rows (known gaps, non-fatal)"
            grep -h "MILESTONE" /tmp/it-all.log 2>/dev/null || echo "(none)"
            echo "### Skipped tests (their media is not in the test data)"
            echo '```'
            grep -h "^=== SKIP" /tmp/it-all.log 2>/dev/null || echo "(none)"
            echo '```'
            echo "### Extended-tier coverage"
            echo '```'
            cat /tmp/coverage-extended.log 2>/dev/null || echo "(no extended coverage log)"
            echo '```'
            echo "### Per-row instruction spend vs baselines"
            echo '```'
            cat /tmp/perf.log 2>/dev/null || echo "(no perf log)"
            echo '```'
            echo "### Slowest tests (wall seconds)"
            echo '```'
            python3 - <<'EOF' 2>/dev/null || echo "(no durations)"
          import json
          rows = [json.loads(l) for l in open("/tmp/durations.jsonl") if l.strip()]
          for r in sorted(rows, key=lambda r: -r["secs"])[:25]:
              print(f"{r['secs']:6d}  {r['status']:7s} {r['test']}")
          EOF
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The web2 frontend (app/web2) is three kinds of job, run in parallel: the
  # static checks and fast tests (ui), the component-gallery screenshots
  # (ui-gallery), and the functional browser end-to-end suite, sharded across
  # runners (ui-e2e).  Each shard runs its specs in two passes: the parallel
  # project three at a time, then the serial one (pacing, jitter, real-time
  # media) alone.  This is the sole home of browser e2e since the legacy web
  # UI was retired.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Every make in this job -- the explicit steps and the one the Playwright
    # webServer runs (`make ui2` builds the core) -- must see the same flags,
    # or the flags stamp changes and the core is rebuilt from scratch.
    env:
      WERROR: "1"
    container:
      image: ghcr.io/pappadf/granny-smith-dev:ubuntu24-emsdk6.0.7-node22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # No submodules: nothing in this job builds the unit suites.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # m68k binutils for the WASM build's declaration-ROM fragments --
      # verified, not installed (see the matching step in the static job).
      - name: Verify m68k binutils presence
        run: |
          which m68k-linux-gnu-as || {
            echo 'm68k-linux-gnu-as not on PATH — the pinned dev image is wrong or stale'
            exit 1
          }

      - name: Install (app/web2)
        working-directory: app/web2
        run: npm ci

      - name: svelte-check
        working-directory: app/web2
        run: npm run check

      - name: Lint + format check
        working-directory: app/web2
        run: npm run lint

      - name: Vite build
        working-directory: app/web2
        run: npm run build

      # Cheap static check — catches origin-rooted URLs and missing
      # COI service worker before they 404 on a real subpath deploy.
      # Doesn't need WASM; runs against bare Vite output.
      - name: check-dist (static validation of app/web2/dist/)
        run: node scripts/check-dist.mjs

      # Full WASM build, then copy artifacts into dist/ so the
      # prod-smoke test below can actually bootstrap the bridge.
      - name: WASM build (for prod-smoke)
        run: make

      - name: ui2 (copy WASM into app/web2/dist/)
        run: make ui2

      # After the WASM build: the printer test loads the interpreter module
      # `make` produced (build/platen-<version>.js) and skips without it.
      - name: Vitest
        working-directory: app/web2
        run: npm test

      - name: Install Playwright (tests/e2e)
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # End-to-end smoke: serves dist/ from a subpath WITHOUT
      # COOP/COEP headers, asserts the page reaches __gsReady and
      # crossOriginIsolated === true. This is the production env
      # GitHub Pages provides; `make run` masks it.
      - name: prod-smoke (Playwright)
        run: make ui2-prod-smoke

      - name: Upload UI build (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-web2-dist
          path: app/web2/dist
          if-no-files-found: ignore

  # The UI gallery: every component story, both colour schemes, compared
  # pixel for pixel with the committed baselines (Vite dev server, no WASM or
  # test data needed). Styling refactors claim zero diff here.
  ui-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/pappadf/granny-smith-dev:ubuntu24-emsdk6.0.7-node22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install (app/web2)
        working-directory: app/web2
        run: npm ci

      - name: Install Playwright (tests/e2e)
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: UI gallery screenshots (Playwright)
        env:
          CI: true
        run: make ui2-gallery

      - name: Upload gallery traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-gallery-traces
          path: tests/e2e/test-results
          if-no-files-found: ignore

  # Functional web2 end-to-end suite (tests/e2e/web2-specs/**): config dialog,
  # checkpoint resume, display drop, URL boot, A/UX realtime boot, video-mode
  # shader baselines, Lisa/Xenix, filesystem tab, ...  Needs the proprietary
  # ROMs/disks, so a job without the token skips it.  Playwright's --shard
  # splits the spec files across the three runners; `npx playwright test
  # --config=playwright.web2.config.ts --shard=K/3` reproduces one locally.
  ui-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Every make in this job -- the explicit steps and the one the Playwright
    # webServer runs (`make ui2` builds the core) -- must see the same flags,
    # or the flags stamp changes and the core is rebuilt from scratch.
    env:
      WERROR: "1"
    container:
      image: ghcr.io/pappadf/granny-smith-dev:ubuntu24-emsdk6.0.7-node22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 7z extracts the large binary archives (e.g. the A/UX HD) the specs
      # boot from.  Verified, not installed (see the static job).
      - name: Verify 7z presence
        run: |
          which 7z || {
            echo '7z not on PATH — the pinned dev image is wrong or stale'
            exit 1
          }

      # m68k binutils for the WASM build's declaration-ROM fragments --
      # verified, not installed (see the matching step in the static job).
      - name: Verify m68k binutils presence
        run: |
          which m68k-linux-gnu-as || {
            echo 'm68k-linux-gnu-as not on PATH — the pinned dev image is wrong or stale'
            exit 1
          }

      # Proprietary test data (internal builds with token access only); the
      # token is scoped to this step.
      - name: Fetch test data
        id: fetch-data
        run: |
          if [ -n "$GS_TEST_DATA_TOKEN" ]; then
            ./scripts/fetch-test-data.sh
            echo "has_test_data=true" >> $GITHUB_OUTPUT
          else
            echo "has_test_data=false" >> $GITHUB_OUTPUT
            echo "::notice::Test data not available — skipping the functional web2 e2e."
          fi
        env:
          GS_TEST_DATA_TOKEN: ${{ secrets.GS_TEST_DATA_TOKEN }}

      # Built here rather than by the Playwright webServer's `make ui2`, so
      # the build does not count against that server's start-up timeout; the
      # webServer's own `make ui2` is then a no-op.
      - name: WASM build + ui2
        if: steps.fetch-data.outputs.has_test_data == 'true'
        run: make ui2

      - name: Install Playwright (tests/e2e)
        if: steps.fetch-data.outputs.has_test_data == 'true'
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Two passes over this shard's specs: the `parallel` project with
      # GS_E2E_WORKERS at once, then the `serial` project (pacing, jitter and
      # real-time media specs) alone, so nothing else competes with it for
      # the runner.  The second pass runs even if the first failed, so one red
      # spec does not hide the other project's results.
      - name: web2 e2e (Playwright, shard ${{ matrix.shard }}/3, parallel)
        id: e2e-parallel
        if: steps.fetch-data.outputs.has_test_data == 'true'
        env:
          CI: true
          GS_E2E_WORKERS: "3"
          GS_E2E_JSON: e2e-report/parallel.json
        working-directory: tests/e2e
        run: npx playwright test --config=playwright.web2.config.ts --project=parallel --shard=${{ matrix.shard }}/3 --pass-with-no-tests --output=test-results/parallel

      - name: web2 e2e (Playwright, shard ${{ matrix.shard }}/3, serial)
        if: always() && steps.fetch-data.outputs.has_test_data == 'true' && steps.e2e-parallel.outcome != 'skipped'
        env:
          CI: true
          GS_E2E_JSON: e2e-report/serial.json
        working-directory: tests/e2e
        run: npx playwright test --config=playwright.web2.config.ts --project=serial --shard=${{ matrix.shard }}/3 --pass-with-no-tests --output=test-results/serial

      # Per-test durations (the github reporter prints none).
      - name: Upload e2e report
        if: always() && steps.fetch-data.outputs.has_test_data == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web2-e2e-report-shard-${{ matrix.shard }}
          path: tests/e2e/e2e-report
          if-no-files-found: ignore

      - name: Upload e2e traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web2-e2e-traces-shard-${{ matrix.shard }}
          path: tests/e2e/test-results
          if-no-files-found: ignore
