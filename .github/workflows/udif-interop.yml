name: UDIF interop

# The images the UDIF writer makes must open in the tools users have: hdiutil
# on macOS, 7-Zip and dmg2img.  A Linux job writes a set of samples with the
# udif_writer unit suite (each beside the disk it must decode to) and checks
# them with 7z and dmg2img; a macOS job checks the same files with hdiutil
# (scripts/check-udif-interop.sh).
#
# The other way round, the images hdiutil makes must open here: the macOS
# job also converts some samples into every compressed format hdiutil writes
# -- ADC, zlib, bzip2, LZFSE, LZMA (scripts/make-udif-foreign.sh) -- and a
# Linux job reads each back through the image layer, byte for byte.

on:
  push:
    branches:
      - main
    paths:
      - 'src/core/storage/udif_writer.*'
      - 'src/core/storage/image_udif.*'
      - 'src/core/storage/image_chunkmap.*'
      - 'src/codec/**'
      - 'tests/unit/suites/udif_writer/**'
      - 'scripts/check-udif-interop.sh'
      - 'scripts/make-udif-foreign.sh'
      - '.github/workflows/udif-interop.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/core/storage/udif_writer.*'
      - 'src/core/storage/image_udif.*'
      - 'src/core/storage/image_chunkmap.*'
      - 'src/codec/**'
      - 'tests/unit/suites/udif_writer/**'
      - 'scripts/check-udif-interop.sh'
      - 'scripts/make-udif-foreign.sh'
      - '.github/workflows/udif-interop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Write the samples
        run: GS_UDIF_INTEROP_DIR="$PWD/udif-samples" make -C tests/unit/suites/udif_writer run WERROR=1

      - name: Install dmg2img
        run: sudo apt-get update -q && sudo apt-get install -y -q dmg2img

      - name: Check them with 7z and dmg2img
        run: scripts/check-udif-interop.sh udif-samples

      - uses: actions/upload-artifact@v7
        with:
          name: udif-samples
          path: udif-samples
          retention-days: 3

  hdiutil:
    needs: samples
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: udif-samples
          path: udif-samples

      - name: Check them with hdiutil
        run: scripts/check-udif-interop.sh udif-samples

      - name: Convert some to every compressed format
        run: scripts/make-udif-foreign.sh udif-samples udif-foreign

      - uses: actions/upload-artifact@v7
        with:
          name: udif-foreign
          path: udif-foreign
          retention-days: 3

  foreign:
    needs: hdiutil
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: udif-foreign
          path: udif-foreign

      - name: Read them back through the image layer
        run: GS_UDIF_FOREIGN_DIR="$PWD/udif-foreign" make -C tests/unit/suites/udif_writer run WERROR=1
