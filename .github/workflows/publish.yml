# Deploy WASM build to the gs-pages deployment repository on GitHub Pages.
#
# Trigger: Publishing a GitHub Release (tag like v1.0.0).
#
# This workflow:
#   1. Builds the WASM emulator (release mode) inside the dev container.
#   2. Clones the gs-pages deployment repository.
#   3. Copies build artifacts into a versioned folder AND /latest/.
#   4. Regenerates the landing page (index.html) listing all versions.
#   5. Pushes the changes to gs-pages, which publishes via GitHub Pages.
#   6. Attaches the same build to the release as granny-smith-web-<tag>.zip
#      (web/ + dev_server.py), for projects that serve a pinned emulator
#      build themselves (scripts/package_web.py).
#   7. (job `headless`) Attaches statically linked gs-headless binaries for
#      Linux x86_64 and arm64, so projects, their devcontainers and coding
#      agents can script the emulator without building it.
#
# Required secrets:
#   DEPLOY_TOKEN  — a GitHub PAT (fine-grained) with Contents: Read & Write
#                   permission on the pappadf/gs-pages repository.

name: Publish to GitHub Pages

on:
  release:
    types: [published]

# The deploy pushes with DEPLOY_TOKEN; GITHUB_TOKEN reads the source and
# uploads the web build to the release (contents: write).
permissions:
  contents: write
  packages: read

# Allow only one publish at a time to avoid push conflicts
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pappadf/granny-smith-dev:ubuntu24-emsdk6.0.7-node22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 1. Checkout source (no submodules: they are test corpora only)
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false

      # 2. Build the WASM emulator + the new Svelte UI (release mode).
      # `make ui2` runs `npm ci && npm run build` in app/web2/, then
      # copies the WASM artifacts produced by `make` into app/web2/dist/.
      - name: Build WASM + new UI (release)
        working-directory: ./source
        run: |
          make clean && make && make ui2

      # 2b. Package the same build as a release asset (web/ + dev_server.py).
      - name: Package web distribution
        working-directory: ./source
        run: |
          python3 scripts/package_web.py "${{ github.event.release.tag_name }}" \
            app/web2/dist "granny-smith-web-${{ github.event.release.tag_name }}.zip"

      # 3. Checkout the deployment repository
      #    `ref` is pinned rather than left to default, deliberately:
      #    without it actions/checkout must call the REST API to ask
      #    which branch is default, and that single call is billed to
      #    the DEPLOY_TOKEN owner's personal 5,000 req/hr budget --
      #    shared across every PAT on that account. A staging deploy
      #    failed on exactly that (run 32534746678). Git fetch/push
      #    over HTTPS is not REST-rate-limited, so pinning the ref
      #    makes this step immune to quota exhaustion.
      - name: Checkout gs-pages
        uses: actions/checkout@v7
        with:
          repository: pappadf/gs-pages
          ref: main
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: deploy

      # 4. Copy the new UI's dist/ tree into the versioned folder + /latest/.
      # app/web2/dist/ is produced by `make ui2` and contains:
      #   index.html, assets/, icons/, main.mjs, main.wasm,
      #   coi-serviceworker.js, platen-*.{js,wasm}, NOTICE
      # The Vite bundle is self-contained, so a whole-directory copy is
      # both simpler and more robust than the legacy per-file list.
      - name: Place artifacts
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          echo "Deploying version: $VERSION"

          SRC_DIST="source/app/web2/dist"

          # --- Versioned folder ---
          rm -rf "deploy/$VERSION"
          mkdir -p "deploy/$VERSION"
          cp -R "$SRC_DIST"/. "deploy/$VERSION/"

          # --- /latest/ (overwrite) ---
          rm -rf deploy/latest
          mkdir -p deploy/latest
          cp -R "$SRC_DIST"/. deploy/latest/

      # 5. Generate the landing page listing all deployed versions
      - name: Generate landing page
        working-directory: ./deploy
        run: |
          python3 << 'LANDING'
          import os, re

          # Collect versioned directories (anything that looks like v1.2.3)
          dirs = [
              d for d in os.listdir(".")
              if os.path.isdir(d)
              and re.match(r"v?\d", d)
              and d not in ("latest",)
          ]
          dirs.sort(key=lambda d: list(map(int, re.findall(r"\d+", d))), reverse=True)

          latest_label = dirs[0] if dirs else "–"

          html = f"""\
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>Granny Smith — Releases</title>
            <style>
              * {{ box-sizing: border-box; }}
              body {{
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                             Arial, sans-serif;
                max-width: 640px; margin: 3rem auto; padding: 0 1rem;
                color: #24292f; background: #fff;
              }}
              h1 {{ font-size: 1.6rem; }}
              a {{ color: #0969da; text-decoration: none; }}
              a:hover {{ text-decoration: underline; }}
              .card {{
                border: 1px solid #d0d7de; border-radius: 6px;
                padding: 12px 16px; margin: 8px 0;
              }}
              .latest {{ background: #dafbe1; border-color: #2da44e; }}
              .latest .badge {{
                display: inline-block; background: #2da44e; color: #fff;
                font-size: 0.75rem; padding: 2px 8px; border-radius: 12px;
                margin-left: 8px; vertical-align: middle;
              }}
              hr {{ border: none; border-top: 1px solid #d0d7de; margin: 1.5rem 0; }}
              .muted {{ color: #656d76; font-size: 0.9rem; }}
            </style>
          </head>
          <body>
            <h1>Granny Smith Emulator</h1>

            <div class="card latest">
              <strong><a href="latest/">Launch Latest</a></strong>
              <span class="badge">{latest_label}</span>
              <div class="muted">Always points to the newest release.</div>
            </div>

            <hr>
            <h3>All Versions</h3>
          """

          for d in dirs:
              html += f'  <div class="card"><a href="{d}/">{d}</a></div>\n'

          html += """\
            <hr>
            <p class="muted">
              Powered by <a href="https://github.com/pappadf/granny-smith">Granny Smith</a>.
            </p>
          </body>
          </html>
          """

          import textwrap
          with open("index.html", "w") as f:
              f.write(textwrap.dedent(html))

          print(f"Landing page generated with {len(dirs)} version(s).")
          LANDING

      # 6. Ensure .nojekyll exists (so GitHub Pages serves .mjs / .wasm)
      - name: Ensure .nojekyll
        working-directory: ./deploy
        run: touch .nojekyll

      # 7. Commit and push to gs-pages
      - name: Push to gs-pages
        working-directory: ./deploy
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${{ github.event.release.tag_name }}"
          git push origin main

      # 8. Attach the packaged build to the release (last, so a failed upload
      #    never holds back the gs-pages deploy)
      - name: Attach web distribution to the release
        working-directory: ./source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "granny-smith-web-${{ github.event.release.tag_name }}.zip" \
            --repo "${{ github.repository }}" --clobber

  # Static gs-headless for Linux, one per architecture (native runners: the
  # dev image is multi-arch).  -static drops the glibc version dependency, so
  # the binary runs in any Linux container or Codespace.  Independent of the
  # deploy job: a failure here holds back nothing else.
  headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/pappadf/granny-smith-dev:ubuntu24-emsdk6.0.7-node22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false

      - name: Build static gs-headless
        working-directory: ./source
        run: make -f Makefile.headless LDFLAGS_MODE=-static -j"$(nproc)"

      - name: Package
        working-directory: ./source
        run: |
          TAG="${{ github.event.release.tag_name }}"
          NAME="granny-smith-headless-$TAG-linux-${{ matrix.arch }}"
          mkdir "$NAME"
          cp build/headless/gs-headless LICENSE "$NAME/"
          strip "$NAME/gs-headless"
          printf '%s\n' \
            "Granny Smith $TAG -- gs-headless, statically linked, Linux ${{ matrix.arch }}" \
            "" \
            "  ./gs-headless --help" \
            "  ./gs-headless --speed=turbo rom=<rom> model=<model> script=<file>" \
            "" \
            "Scripting and the debug shell: https://github.com/pappadf/granny-smith" \
            > "$NAME/README.txt"
          tar czf "$NAME.tar.gz" "$NAME"

      - name: Attach to the release
        working-directory: ./source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "granny-smith-headless-${{ github.event.release.tag_name }}-linux-${{ matrix.arch }}.tar.gz" \
            --repo "${{ github.repository }}" --clobber
