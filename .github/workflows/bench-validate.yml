name: Bench validation (temporary)

# TEMPORARY: the bench workflow's validation runs, on this branch only.
# Ten no-op runs (head = this branch, base = its merge base; nothing under the
# CPU's run function differs), five per metric-B pairing mode, and one run
# with a deliberate per-instruction regression in the 68030 loop.  Removed
# before merge; the thresholds commit records the run.

on:
  push:
    branches:
      - claude/compassionate-pascal-7t0jjy

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rep: 1, pairing: alternate, regress: false}
          - {rep: 2, pairing: alternate, regress: false}
          - {rep: 3, pairing: alternate, regress: false}
          - {rep: 4, pairing: alternate, regress: false}
          - {rep: 5, pairing: alternate, regress: false}
          - {rep: 6, pairing: concurrent, regress: false}
          - {rep: 7, pairing: concurrent, regress: false}
          - {rep: 8, pairing: concurrent, regress: false}
          - {rep: 9, pairing: concurrent, regress: false}
          - {rep: 10, pairing: concurrent, regress: false}
          - {rep: 11, pairing: alternate, regress: true}
    container:
      image: ghcr.io/pappadf/granny-smith-dev:ubuntu24-emsdk6.0.7-node22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch test data
        run: ./scripts/fetch-test-data.sh
        env:
          GS_TEST_DATA_TOKEN: ${{ secrets.GS_TEST_DATA_TOKEN }}

      - name: Deliberate regression (68030 loop)
        if: matrix.regress
        run: |
          python3 - <<'EOF'
          p = 'src/core/cpu/cpu_68030.c'
          s = open(p).read()
          i = s.index("        cpu->pc += 2;")
          add = ("        if (__builtin_expect(cpu->last_bus_error_pc == cpu->pc + 1, 0))" .ljust(119) + "\\\n"
                 + "            cpu->last_bus_error_pc = 0;".ljust(119) + "\\\n")
          s = s[:i] + add + s[i:]
          open(p, 'w').write(s)
          EOF
          git diff --stat

      - name: Build head and base
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -f Makefile.headless -j"$(nproc)"
          base="$(git merge-base origin/main HEAD)"
          echo "base $base"
          scripts/bench/build-base.sh "$base" bench-base/gs-headless

      - name: Run
        run: |
          mkdir -p bench-out
          nproc; grep -m1 "model name" /proc/cpuinfo
          python3 scripts/bench/run.py --head build/headless/gs-headless --base bench-base/gs-headless \
            --rows all --metrics A,B,C --pairing ${{ matrix.pairing }} --rounds 5 \
            --work bench-work --out bench-out/raw.jsonl 2>&1 | tee bench-out/run.log
          exit "${PIPESTATUS[0]}"

      - name: Compare
        run: |
          python3 scripts/bench/compare.py bench-out/raw.jsonl --summary "$GITHUB_STEP_SUMMARY" --json bench-out/bench.json || echo "compare exit $?"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-validate-${{ matrix.rep }}
          path: bench-out/
          if-no-files-found: ignore
