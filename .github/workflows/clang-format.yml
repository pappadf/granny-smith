name: Clang-Format Check

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatting-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The pre-commit hook itself, so CI and a local commit agree on the
      # clang-format version (the hook's pin) and on what is checked: every
      # C file in the repository except src/peeler, which keeps its own
      # upstream style.  Before, CI checked src/ only (peeler included) with
      # the distribution's clang-format, and tests/ and tools/ with nothing.
      # pipx is preinstalled on the runner; Ubuntu 24.04's system Python
      # refuses a plain `pip install` (PEP 668).
      - name: Check formatting (pre-commit clang-format hook)
        run: pipx run pre-commit run clang-format --all-files --show-diff-on-failure
